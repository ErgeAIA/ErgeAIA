# 定时生成 GitHub 贡献贪吃蛇图，输出到 dist 分支供 README「GitHub 活动」区块引用
#
# 产物 URL：
#   https://raw.githubusercontent.com/ErgeAIA/ErgeAIA/dist/github-contribution-grid-snake.svg
#   https://raw.githubusercontent.com/ErgeAIA/ErgeAIA/dist/github-contribution-grid-snake-dark.svg
#
# 两个必须知道的实现约束（都是踩过的坑，勿改）：
#   1. snk 只把 SVG 写进工作区，**从不推分支**。推送必须自己写 git 步骤。
#      早期版本误用第三方 action peachris/actions-gg-pages 推送，该仓库已不存在
#      （报错 Unable to resolve action / repository not found），故改为纯 git。
#   2. snk v3 的颜色**不是 action input**，只能写在 outputs 每行的查询串里。
#      传 color_A/color_B/... 会报 "Unexpected input(s)" 并被静默忽略。
#      color_dots 必须是正好 5 个颜色，顺序为 0 贡献 -> 最高贡献。
#
# 与 streak.yml 写同一 dist 分支，cron 刻意错开（snake 03:27 / streak 05:41 UTC）避免并发 push。

name: Generate contribution snake

on:
  schedule:
    # 每天 03:27 UTC —— 避开整点，减少 GitHub Actions 排队延迟
    - cron: '27 3 * * *'
  workflow_dispatch: # 支持手动触发（首次启用时用）

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG
        # 必须用 snk@v3，不能用 snk/svg-only@v3 —— 后者是另一个更快的实现，
        # 不支持 color_snake / color_dots / palette 这些 options，会静默退回
        # GitHub 默认色 #1b1f23（深灰），在浅色模式下表现为白底深格。
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 配色取自 ThemeVault 004 号主题 opensquilla/ember
          # 浅色底（GitHub 浅色模式）：浅灰 -> 深橙 梯度
          # 深色底（GitHub 深色模式）：#241512 卡面 -> #ff6a2b 主色
          # 关键：每个 hex 必须写成 %23（URL 编码的 #），否则整个颜色参数被**静默丢弃**，
          # 产物退回 GitHub 默认色 #1b1f23。实测对比：
          #   ?color_snake=ff6a2b&color_dots=ebedf0,...        -> 失效（裸 hex）
          #   ?color_snake=%23ff6a2b&color_dots=%23ebedf0,...  -> 生效
          # color_dots 必须是正好 5 个，顺序为 0 贡献 -> 最高贡献
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23c23e12&color_dots=%23ebedf0,%23dfe1e6,%23ffb638,%23ff6a2b,%23c23e12
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ff8047&color_dots=%23241512,%23452c23,%23c23e12,%23ff6a2b,%23ffb638

      - name: Publish to dist branch
        run: |
          set -euo pipefail
          mkdir -p publish && cd publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          # 先建立/切换到 dist 分支，再覆盖式放入本次产物，避免 checkout 冲突
          if git ls-remote --exit-code --heads origin dist >/dev/null 2>&1; then
            git fetch -q origin dist
            git checkout -q -B dist origin/dist
          else
            git checkout -q -b dist
          fi
          # 先清空 publish 目录里的 svg，让 dist 分支内容与本次产物严格一致
          # （否则上一轮遗留的测试文件会永久留在分支上）
          rm -f ./*.svg
          cp -f ../dist/*.svg .

          git add -A
          if git diff --cached --quiet; then
            echo "产物无变化，跳过推送"
            exit 0
          fi
          git commit -q -m "chore: update contribution snake"
          git push -q origin dist
          echo "贪吃蛇图已推送到 dist 分支"
